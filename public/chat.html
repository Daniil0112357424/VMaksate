<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="appTitle">ВМаксате Messenger</title>
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme = localStorage.getItem('vmakstate_theme') === 'dark' ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="sidebar">
        <div class="sidebar-top">
          <div class="card-header">
            <div class="brand-logo">
              <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <h1 data-i18n="appTitle">ВМаксате</h1>
            </div>
            <div class="header-tools">
              <div class="lang-switcher">
                <select class="langSelect lang-select" aria-label="Language selector">
                  <option value="ru">RU</option>
                  <option value="en">EN</option>
                  <option value="es">ES</option>
                </select>
              </div>
              <button id="globalSearchBtn" class="icon-btn" type="button" data-i18n-title="globalSearch" title="Поиск по всем чатам" aria-label="Поиск по всем чатам">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="18" y1="18" x2="15" y2="15"/></svg>
              </button>
              <button class="icon-btn sound-toggle" type="button" data-sound-toggle data-i18n-title="soundToggle" title="Звуки уведомлений" aria-label="Звуки уведомлений" aria-pressed="true">
                <svg class="icon-sound-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"></path>
                </svg>
                <svg class="icon-sound-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="m16 9 5 5M21 9l-5 5"></path>
                </svg>
              </button>
              <button class="icon-btn theme-toggle" type="button" data-theme-toggle data-i18n-title="themeToggle" aria-label="Сменить тему" aria-pressed="false">
                <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
              </button>
            </div>
          </div>
          <div id="currentUserBadge" class="current-user-badge"></div>
          <div class="sidebar-actions">
            <button id="profileBtn" class="sidebar-action" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
              </svg>
              <span data-i18n="profileBtn">Профиль</span>
            </button>
            <button id="logoutBtn" class="sidebar-action" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="m16 17 5-5-5-5M21 12H9"></path>
              </svg>
              <span data-i18n="logoutBtn">Выйти</span>
            </button>
          </div>
        </div>

        <div class="search-section">
          <label class="sr-only" for="searchInput" data-i18n="searchLabel">Поиск собеседника</label>
          <div class="search-row">
            <div class="search-input-wrap">
              <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input id="searchInput" data-i18n-ph="phSearch" placeholder="Ищите по user id или имени" autocomplete="off" />
            </div>
            <button id="searchBtn" type="button" class="search-btn" data-i18n="searchBtn">Найти</button>
          </div>
          <button id="newGroupBtn" type="button" class="new-group-btn" data-i18n="createGroup" title="Создать групповой чат" aria-label="Создать групповой чат">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="createGroup">Создать группу</span>
          </button>
        </div>

        <div id="userList" class="user-list"></div>
      </section>

      <section class="chat-panel no-chat">
        <div class="chat-header">
          <div class="chat-header-info">
            <button id="mobileBackBtn" class="mobile-back-btn" aria-label="Back" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div id="partnerAvatar" class="partner-avatar hidden">?</div>
            <div class="chat-partner-details">
              <div class="caption" data-i18n="dialogCaption">Диалог</div>
              <strong id="chatPartner" data-i18n="selectPartnerPlaceholder">Выберите собеседника</strong>
              <span id="partnerPresence" class="partner-presence" data-i18n-title="dialogCaption"></span>
              <span id="partnerAbout" class="partner-about"></span>
              <span id="typingIndicator" class="typing-indicator" aria-live="polite"></span>
            </div>
          </div>
          <div class="call-actions">
            <button id="chatSearchBtn" class="call-icon-btn" type="button" data-i18n-title="searchInChat" title="Поиск в диалоге" aria-label="Поиск в диалоге" aria-expanded="false" aria-controls="chatSearchBar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button id="groupInfoBtn" class="call-icon-btn" type="button" hidden data-i18n-title="groupInfo" title="Информация о группе" aria-label="Информация о группе">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01M12 3v0.01M12 21v0.01"/></svg>
            </button>
            <button id="blockUserBtn" class="call-icon-btn" type="button" hidden data-i18n-title="blockUser" title="Заблокировать пользователя" aria-label="Заблокировать пользователя">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><path d="M21 4H3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3z"/></svg>
            </button>
            <button id="exportChatBtn" class="call-icon-btn" type="button" data-i18n-title="exportChat" title="Экспорт чата" aria-label="Экспорт чата">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="audioCallBtn" class="call-icon-btn" type="button" disabled data-i18n-title="audioCallTitle" title="Аудиозвонок" aria-label="Аудиозвонок">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <button id="videoCallBtn" class="call-icon-btn" type="button" disabled data-i18n-title="videoCallTitle" title="Видеозвонок" aria-label="Видеозвонок">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="3"/></svg>
            </button>
          </div>
        </div>

        <div id="chatSearchBar" class="chat-search-bar hidden">
          <input id="chatSearchInput" type="search" data-i18n-ph="searchInChat" placeholder="Поиск в диалоге" autocomplete="off" />
          <span id="chatSearchStatus" class="chat-search-status" aria-live="polite"></span>
          <button id="chatSearchPrev" class="chat-search-nav" type="button" data-i18n-title="searchPrev" title="Предыдущее совпадение" aria-label="Предыдущее совпадение">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
          </button>
          <button id="chatSearchNext" class="chat-search-nav" type="button" data-i18n-title="searchNext" title="Следующее совпадение" aria-label="Следующее совпадение">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button id="chatSearchClose" class="chat-search-close" type="button" data-i18n-title="closeBtnLabel" aria-label="Закрыть">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div id="messages" class="messages"></div>

        <button id="scrollToBottomBtn" class="scroll-to-bottom hidden" type="button" data-i18n-title="scrollToBottom" title="Вниз" aria-label="Вниз">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          <span id="scrollToBottomCount" class="scroll-to-bottom-count hidden"></span>
        </button>

        <div id="attachmentPreview" class="attachment-preview hidden">
          <img id="attachmentPreviewImage" alt="" />
          <span id="attachmentPreviewName"></span>
          <button id="removeAttachmentBtn" type="button" aria-label="Удалить вложение">×</button>
        </div>
        <div id="recordingBar" class="recording-bar hidden">
          <span class="recording-dot" aria-hidden="true"></span>
          <span id="recordingTime" aria-live="off">0:00</span>
          <button id="voiceCancelBtn" class="recording-cancel" type="button" data-i18n-title="voiceCancel" title="Отменить запись" aria-label="Отменить запись">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <button id="voiceStopBtn" class="recording-stop" type="button" data-i18n-title="voiceStop" title="Отправить голосовое" aria-label="Отправить голосовое">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <div id="replyBar" class="reply-bar hidden">
          <svg class="reply-bar-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
          <div class="reply-bar-content">
            <span id="replyBarName"></span>
            <span id="replyBarText"></span>
          </div>
          <button id="replyCancelBtn" type="button" data-i18n-title="closeBtnLabel" title="Закрыть" aria-label="Закрыть">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="composer">
          <div class="sticker-menu-wrap">
            <button id="emojiBtn" class="attachment-btn" type="button" data-i18n-title="emojiTitle" title="Эмодзи" aria-label="Эмодзи">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
            </button>
            <div id="emojiMenu" class="emoji-menu hidden"></div>
          </div>
          <label class="attachment-btn" data-i18n-title="attachPhotoTitle" title="Прикрепить фото" aria-label="Прикрепить фото">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <label class="attachment-btn" data-i18n-title="attachFile" title="Прикрепить файл" aria-label="Прикрепить файл">
            <input id="fileInput" type="file" hidden />
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13h-8"/><path d="M16 17h-8"/></svg>
          </label>
          <div class="sticker-menu-wrap">
            <button id="stickerBtn" class="attachment-btn" type="button" data-i18n-title="stickersTitle" title="Стикеры" aria-label="Стикеры">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
            </button>
            <div id="stickerMenu" class="sticker-menu hidden">
            <button id="etoRealnoSticker" type="button" title="Это реально" class="sticker-btn"><img src="/stickers/eto-realno.jpg" alt="Это реально" /></button>
            <button type="button" title="😀" class="sticker-btn sticker-emoji" data-sticker="😀">😀</button>
            <button type="button" title="😂" class="sticker-btn sticker-emoji" data-sticker="😂">😂</button>
            <button type="button" title="❤️" class="sticker-btn sticker-emoji" data-sticker="❤️">❤️</button>
            <button type="button" title="🔥" class="sticker-btn sticker-emoji" data-sticker="🔥">🔥</button>
            <button type="button" title="😎" class="sticker-btn sticker-emoji" data-sticker="😎">😎</button>
            <button type="button" title="🎉" class="sticker-btn sticker-emoji" data-sticker="🎉">🎉</button>
            <button type="button" title="👍" class="sticker-btn sticker-emoji" data-sticker="👍">👍</button>
            <button type="button" title="😢" class="sticker-btn sticker-emoji" data-sticker="😢">😢</button>
          </div>
          </div>
          <input id="messageInput" data-i18n-ph="phMessage" placeholder="Напишите сообщение..." autocomplete="off" />
          <button id="voiceBtn" class="attachment-btn voice-btn" type="button" data-i18n-title="voiceRecordStart" title="Голосовое сообщение" aria-label="Голосовое сообщение">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 22h8"/></svg>
          </button>
          <button id="sendBtn" class="send-btn" type="button">
            <span class="send-label" data-i18n="sendBtn">Отправить</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </section>
    </main>

    <section id="profileModal" class="profile-modal hidden">
      <form id="profileForm" class="profile-dialog">
        <div class="profile-dialog-header">
          <strong data-i18n="profileTitle">Профиль</strong>
          <button id="closeProfileBtn" class="close-btn" type="button" data-i18n-title="closeBtnLabel" aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <label class="profile-avatar-picker" for="profileImageInput">
          <span id="profileAvatarPreview">?</span>
          <span class="avatar-edit-hint" aria-hidden="true">+</span>
          <input id="profileImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        </label>
        <label class="block-label" for="profileNameInput" data-i18n="profileNameLabel">Имя</label>
        <input id="profileNameInput" maxlength="80" required />
        <label class="block-label" for="profileAboutInput" data-i18n="profileAboutLabel">О себе</label>
        <textarea id="profileAboutInput" maxlength="160" rows="3" data-i18n-ph="profileAboutPlaceholder" placeholder="Расскажите немного о себе"></textarea>
        <div class="profile-user-id"><span data-i18n="profileUserIdLabel">User ID</span><span id="profileUserId"></span></div>
        <details class="password-change">
          <summary data-i18n="passwordChangeTitle">Смена пароля</summary>
          <label class="block-label" for="profileCurrentPassword" data-i18n="currentPasswordLabel">Текущий пароль</label>
          <input id="profileCurrentPassword" type="password" autocomplete="current-password" data-i18n-ph="phCurrentPassword" placeholder="Введите текущий пароль" />
          <label class="block-label" for="profileNewPassword" data-i18n="newPasswordLabel">Новый пароль</label>
          <input id="profileNewPassword" type="password" autocomplete="new-password" data-i18n-ph="phNewPassword" placeholder="Придумайте новый пароль" maxlength="72" />
          <div class="password-change-footer">
            <button id="changePasswordBtn" class="secondary-btn" type="button" data-i18n="changePasswordBtn">Изменить пароль</button>
            <span id="passwordChangeStatus" aria-live="polite"></span>
          </div>
        </details>
        <button class="primary-btn" type="submit" data-i18n="saveProfileBtn">Сохранить</button>
      </form>
    </section>

    <section id="callOverlay" class="call-overlay hidden" aria-live="polite">
      <div class="call-surface">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <video id="localVideo" class="local-video hidden" autoplay muted playsinline></video>
        <div class="call-information">
          <div id="callAvatar" class="call-avatar">?</div>
          <strong id="callPartnerName">Звонок</strong>
          <span id="callStatus">Подключение...</span>
        </div>
        <div class="call-controls">
          <button id="acceptCallBtn" class="call-control accept hidden" type="button" data-i18n-title="acceptCallTitle" title="Ответить" aria-label="Ответить">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button id="declineCallBtn" class="call-control decline hidden" type="button" data-i18n-title="declineCallTitle" title="Отклонить" aria-label="Отклонить">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16M20 4 4 20"/></svg>
          </button>
          <button id="endCallBtn" class="call-control decline" type="button" data-i18n-title="endCallTitle" title="Завершить звонок" aria-label="Завершить звонок">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section id="groupInfoModal" class="group-info-modal hidden">
      <form id="groupInfoForm" class="group-info-dialog">
        <div class="group-info-header">
          <strong data-i18n="groupInfo">Информация о группе</strong>
          <button id="closeGroupInfoBtn" class="close-btn" type="button" data-i18n-title="closeBtnLabel" aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="group-info-body">
          <div class="group-info-avatar-wrap">
            <div id="groupInfoAvatar" class="group-info-avatar">?</div>
            <div class="group-info-meta">
              <div id="groupInfoName" class="group-info-name"></div>
              <div id="groupInfoType" class="group-info-type" data-i18n="groupChat">Групповой чат</div>
            </div>
          </div>
          <label class="block-label" data-i18n="groupName">Название группы</label>
          <input id="groupInfoNameInput" maxlength="80" required />
          <div class="group-info-members">
            <strong data-i18n="groupMembers">Участники группы</strong>
            <div id="groupInfoMembersList"></div>
          </div>
          <div class="group-info-actions">
            <button id="groupAddMembersBtn" type="button" class="secondary-btn" data-i18n="addMembers">Добавить участников</button>
            <button id="groupLeaveBtn" type="button" class="danger-btn" data-i18n="leaveGroup">Покинуть группу</button>
          </div>
        </div>
      </form>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
