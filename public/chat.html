<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appTitle">ВМаксате Messenger</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sidebar">
        <div class="sidebar-top">
          <div class="card-header">
            <h1 data-i18n="appTitle">ВМаксате</h1>
            <div class="lang-switcher">
              <select class="langSelect lang-select" aria-label="Language selector">
                <option value="ru">🇷🇺 RU</option>
                <option value="en">🇬🇧 EN</option>
                <option value="es">🇪🇸 ES</option>
              </select>
            </div>
          </div>
          <div id="currentUserBadge" class="current-user-badge"></div>
          <button id="logoutBtn" data-i18n="logoutBtn">Выйти</button>
        </div>

        <label class="block-label" for="searchInput" data-i18n="searchLabel">Поиск собеседника</label>
        <div class="search-row">
          <input id="searchInput" data-i18n-ph="phSearch" placeholder="Ищите по user id или имени" />
          <button id="searchBtn" type="button" data-i18n="searchBtn">Найти</button>
        </div>
        <div id="userList" class="user-list"></div>
      </section>

      <section class="chat-panel">
        <div class="chat-header">
          <div>
            <div class="caption" data-i18n="dialogCaption">Диалог</div>
            <strong id="chatPartner" data-i18n="selectPartnerPlaceholder">Выберите собеседника</strong>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="composer">
          <input id="messageInput" data-i18n-ph="phMessage" placeholder="Напишите сообщение..." />
          <button id="sendBtn" data-i18n="sendBtn">Отправить</button>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
