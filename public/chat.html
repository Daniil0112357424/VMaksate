<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title data-i18n="appTitle">ВМаксате Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="sidebar">
        <div class="sidebar-top">
          <div class="card-header">
            <div class="brand-logo">
              <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <h1 data-i18n="appTitle">ВМаксате</h1>
            </div>
            <div class="lang-switcher">
              <select class="langSelect lang-select" aria-label="Language selector">
                <option value="ru">🇷🇺 RU</option>
                <option value="en">🇬🇧 EN</option>
                <option value="es">🇪🇸 ES</option>
              </select>
            </div>
          </div>
          <div id="currentUserBadge" class="current-user-badge"></div>
          <div class="sidebar-actions">
            <button id="profileBtn" class="auth-secondary-btn" type="button" data-i18n="profileBtn">Профиль</button>
            <button id="logoutBtn" class="auth-secondary-btn" data-i18n="logoutBtn">Выйти</button>
          </div>
        </div>

        <div class="search-section">
          <label class="block-label" for="searchInput" data-i18n="searchLabel">Поиск собеседника</label>
          <div class="search-row">
            <div class="search-input-wrap">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input id="searchInput" data-i18n-ph="phSearch" placeholder="Ищите по user id или имени" autocomplete="off" />
            </div>
            <button id="searchBtn" type="button" class="primary-btn" data-i18n="searchBtn">Найти</button>
          </div>
        </div>

        <div id="userList" class="user-list"></div>
      </section>

      <section class="chat-panel">
        <div class="chat-header">
          <div class="chat-header-info">
            <button id="mobileBackBtn" class="mobile-back-btn" aria-label="Back">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div id="partnerAvatar" class="partner-avatar hidden">?</div>
            <div>
              <div class="caption" data-i18n="dialogCaption">Диалог</div>
              <strong id="chatPartner" data-i18n="selectPartnerPlaceholder">Выберите собеседника</strong>
            </div>
          </div>
          <div class="call-actions">
            <button id="audioCallBtn" class="call-icon-btn" type="button" disabled data-i18n-title="audioCallTitle" title="Аудиозвонок" aria-label="Аудиозвонок">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <button id="videoCallBtn" class="call-icon-btn" type="button" disabled data-i18n-title="videoCallTitle" title="Видеозвонок" aria-label="Видеозвонок">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div id="attachmentPreview" class="attachment-preview hidden">
          <img id="attachmentPreviewImage" alt="" />
          <span id="attachmentPreviewName"></span>
          <button id="removeAttachmentBtn" type="button" aria-label="Удалить вложение">×</button>
        </div>
        <div class="composer">
          <label class="attachment-btn" data-i18n-title="attachPhotoTitle" title="Прикрепить фото" aria-label="Прикрепить фото">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <div class="sticker-menu-wrap">
            <button id="stickerBtn" class="attachment-btn" type="button" data-i18n-title="stickersTitle" title="Стикеры" aria-label="Стикеры">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
            </button>
            <div id="stickerMenu" class="sticker-menu hidden"><button id="etoRealnoSticker" type="button" title="Это реально"><img src="/stickers/eto-realno.jpg" alt="Это реально" /></button></div>
          </div>
          <input id="messageInput" data-i18n-ph="phMessage" placeholder="Напишите сообщение..." autocomplete="off" />
          <button id="sendBtn" class="send-btn">
            <span data-i18n="sendBtn">Отправить</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </section>
    </main>

    <section id="profileModal" class="profile-modal hidden">
      <form id="profileForm" class="profile-dialog">
        <div class="profile-dialog-header"><strong data-i18n="profileTitle">Профиль</strong><button id="closeProfileBtn" class="close-btn" type="button" aria-label="Закрыть">×</button></div>
        <label class="profile-avatar-picker" for="profileImageInput"><span id="profileAvatarPreview">?</span><input id="profileImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden /></label>
        <label class="block-label" for="profileNameInput" data-i18n="profileNameLabel">Имя</label>
        <input id="profileNameInput" maxlength="80" required />
        <div class="profile-user-id"><span data-i18n="profileUserIdLabel">User ID</span>: <span id="profileUserId"></span></div>
        <button class="primary-btn" type="submit" data-i18n="saveProfileBtn">Сохранить</button>
      </form>
    </section>

    <section id="callOverlay" class="call-overlay hidden" aria-live="polite">
      <div class="call-surface">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <video id="localVideo" class="local-video hidden" autoplay muted playsinline></video>
        <div class="call-information">
          <div id="callAvatar" class="call-avatar">?</div>
          <strong id="callPartnerName">Звонок</strong>
          <span id="callStatus">Подключение...</span>
        </div>
        <div class="call-controls">
          <button id="acceptCallBtn" class="call-control accept hidden" type="button" data-i18n-title="acceptCallTitle" title="Ответить" aria-label="Ответить">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button id="declineCallBtn" class="call-control decline hidden" type="button" data-i18n-title="declineCallTitle" title="Отклонить" aria-label="Отклонить">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4 4 20"/></svg>
          </button>
          <button id="endCallBtn" class="call-control decline" type="button" data-i18n-title="endCallTitle" title="Завершить звонок" aria-label="Завершить звонок">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.64a2 2 0 0 1-.45 2.11L8.01 9.74a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.29 1.74.5 2.64.62A2 2 0 0 1 22 16.92z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
