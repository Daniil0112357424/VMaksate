<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ВМаксате — Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="adminPage" class="admin-shell">
      <section class="admin-card">
        <h1>Admin Panel</h1>
        <p class="auth-subtitle">Доступ только по паролю</p>

        <section id="adminLoginSection" class="admin-panel active">
          <form id="adminLoginForm" class="auth-form">
            <label class="block-label" for="adminPassword">Пароль</label>
            <input id="adminPassword" name="password" type="password" placeholder="Введите пароль" required />
            <button type="submit">Войти в админку</button>
          </form>
        </section>

        <section id="adminDashboard" class="admin-panel">
          <div class="admin-actions">
            <button type="button" id="deleteAllUsersBtn">Удалить всех</button>
            <button type="button" id="logoutAdminBtn" class="auth-secondary-btn">Выйти</button>
          </div>

          <div id="adminMessage" class="auth-message"></div>
          <div id="adminUserList" class="admin-user-list"></div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
