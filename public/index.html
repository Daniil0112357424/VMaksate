<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ВМаксате — Вход</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="authPage" class="auth-shell">
      <section class="auth-card">
        <h1>ВМаксате</h1>
        <p class="auth-subtitle">Регистрация и вход в ваш аккаунт</p>

        <form id="registerForm" class="auth-form">
          <label class="block-label" for="registerId">Ваш user id</label>
          <input id="registerId" name="id" placeholder="Например: user-42" required />

          <label class="block-label" for="registerLabel">Ваше имя</label>
          <input id="registerLabel" name="label" placeholder="Например: Иван" required />

          <label class="block-label" for="registerPassword">Пароль</label>
          <input id="registerPassword" name="password" type="password" placeholder="Придумайте пароль" required />

          <button type="submit">Зарегистрироваться</button>
        </form>

        <form id="loginForm" class="auth-form">
          <label class="block-label" for="loginId">User id</label>
          <input id="loginId" name="id" placeholder="Введите ваш id" required />

          <label class="block-label" for="loginPassword">Пароль</label>
          <input id="loginPassword" name="password" type="password" placeholder="Введите пароль" required />

          <button type="submit">Войти</button>
        </form>

        <div id="authMessage" class="auth-message"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
